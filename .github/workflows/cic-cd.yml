name: Build And Push to ECR and Ecs

on: 
    push:
        # pull_requests: 
        #     branches: ['main', 'dev']
        branches: [ 'main']

permissions:
  id-token: write
  contents: read

jobs:
    build_scan:
        runs-on: ubuntu-latest
        steps:
           - name: checkout code
             uses: actions/checkout@v7
           - name:   Trivy Scan
             uses: aquasecurity/trivy-action@v0.36.0
             with:
                scan-type: 'fs'
                severity: HIGH,CRITICAL
                exit-code: 1 
           - name:  Build image
             run: docker build -t 196135431738.dkr.ecr.us-east-1.amazonaws.com/portfolio-ecr:latest .    
           
           - name: Scan image with Trivy 
             uses: aquasecurity/trivy-action@v0.36.0
             with: 
                image-ref: 196135431738.dkr.ecr.us-east-1.amazonaws.com/portfolio-ecr:latest
                format: table 
                exit-code: 0
                ignore-unfixed: true 
                severity: CRITICAL,HIGH
           
           - name: Configure AWS credentials
             uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
             with:
                role-to-assume: arn:aws:iam::196135431738:role/githuaction-role-26
                aws-region: us-east-1
           - name: Login to Amazon ECR
             id: login-ecr
             uses: aws-actions/amazon-ecr-login@v2     
            

           - name: push Image to Ecr
             run: docker push 196135431738.dkr.ecr.us-east-1.amazonaws.com/portfolio-ecr:latest